<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>Sidequest — Telegram Social</title><script src="https://telegram.org/js/telegram-web-app.js?64"></script><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">✳</span><span>sidequest</span></div><button class="avatar my-avatar" id="profileButton" aria-label="Open profile">M</button></header>
<main><section class="welcome"><div><p class="eyebrow">YOUR LITTLE CORNER</p><h1>Good to see you<span class="wave">✦</span></h1><p class="subhead">A place for the things you’re into.</p></div><div class="streak"><span>✹</span><b>3</b><small>day streak</small></div></section>

<section class="discover-card"><div class="discover-icon">✷</div><div><b>Find your people</b><p>Follow a few folks to make this place yours.</p></div><button id="discoverButton">Explore</button></section></main>
<nav class="bottom-nav"><button class="nav-item active" data-tab="home"><span>⌂</span><small>Home</small></button><button class="nav-item" data-tab="search"><span>⌕</span><small>Discover</small></button><button class="nav-create" id="navCreate">＋</button><button class="nav-item" data-tab="activity"><span>♡</span><small>Activity</small></button><button class="nav-item" data-tab="profile"><span id="navInitial">M</span><small>You</small></button></nav></div>
<div id="modal" class="modal hidden"><div class="modal-scrim" data-close="1"></div><section class="modal-panel"><div class="modal-grab"></div><div class="modal-title"><h2 id="modalTitle">Your note</h2><button class="close-button" data-close="1">×</button></div><div id="modalBody"></div></section></div><div id="toast" class="toast"></div><script src="app.js"></script></body></html>
