services:
  - type: web
    name: sidequest-telegram-mini-app
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: "python --version"
    startCommand: "python server.py"
    healthCheckPath: /health
    disk:
      name: sidequest-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/sidequest.sqlite3

